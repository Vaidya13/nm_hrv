# ============================================================
# nm_hrv  –  WFDB / PhysioNet configuration
# ============================================================
pipeline_version: "1.1"

data_format: "wfdb"

data_folder:  "/path/to/your/wfdb_data"
metadata_csv: "/path/to/your/metadata.csv"
output_dir:   "/path/to/your/output"

# ===================================
# METADATA COLUMNS TO CARRY
# ===================================
# List every column from your metadata CSV that should appear in the output.
# participant_id and age are always carried automatically.
# Leave empty ([]) to carry ALL scalar columns (safe default).
#
# For cross-cohort normative modelling include:
#   sex, bmi, body_position, time_of_day, diagnosis, cohort, device
#
# Example:
#   metadata_columns_to_carry:
#     - sex
#     - bmi
#     - body_position
#     - cohort
#
metadata_columns_to_carry: []

# ===================================
# SQI MODE
# ===================================
# "flag" (default) — SQI is recorded but never blocks HRV extraction.
#   Windows get Quality="good" or "good_low_sqi". Use for heterogeneous
#   cohorts, dry electrodes, clinical data. Decide inclusion threshold
#   later using HRV_Confidence and SQI_Score columns.
# "gate" — hard stop: windows failing SQI thresholds get Quality="poor_sqi"
#   and HRV is not computed. Use only for clean single-device cohorts.
sqi_mode: "flag"

# ===================================
# ECG PREPROCESSING
# ===================================
hp_cutoff:    0.5
lp_cutoff:    40.0
notch_freq:   60.0     # MIT-BIH and most US PhysioNet datasets → 60 Hz
filter_order: 2

# ===================================
# RR PLAUSIBILITY
# ===================================
rr_min_ms:    300.0
rr_max_ms:    2000.0

# ===================================
# LOCAL OUTLIER DETECTION
# ===================================
local_window_beats:  11
local_dev_thresh:    0.20

# ===================================
# MISSED / EXTRA BEAT THRESHOLDS
# ===================================
missed_beat_gap_factor: 1.8
extra_beat_gap_factor:  0.5

# ===================================
# ARTIFACT TOLERANCE
# ===================================
max_artifact_fraction: 0.05

# ===================================
# HRV WINDOWING
# ===================================
window_sec: 300
keep_first_window_only: false

# ===================================
# ANALYSE ONLY PART OF A RECORDING (e.g. resting state)
# ===================================
# Leave segments_csv empty (default) to analyse the whole recording in 5-min
# windows, exactly as before. Otherwise give a CSV with columns
# participant_id,start_sec,stop_sec (times in seconds from the START OF THE
# RECORDING, or HH:MM:SS) and optional extra columns such as label. Only the
# listed segments are analysed; files not listed are skipped.
# When analysing short segments also set  min_rr_for_hrv: 30  (see below).
# See README, "Analysing part of a recording".
segments_csv: ""
segment_windowing: "tile"     # "tile": consecutive window_sec windows inside each
                              #         segment (a final partial window is kept if
                              #         long enough)
                              # "whole": each segment = one window of any length
min_window_sec: 60            # segments / partial windows shorter than this are
                              # not analysed (listed in skipped_segments.csv)

# ===================================
# HRV COMPUTATION
# ===================================
min_rr_for_hrv:          150
smoothness_prior_lambda: 300

# ===================================
# PSD SETTINGS  (Welch)
# ===================================
psd_nperseg:  256
psd_noverlap: 128
psd_window:   "hann"

# ===================================
# SQI THRESHOLDS
# ===================================
sqi_qrs_min:           0.25
template_corr_min:     0.80
max_flatline_fraction: 0.05
max_clipping_fraction: 0.01
min_rpeaks:            20

# ===================================
# PEAK DETECTION
# ===================================
ecg_peaks_method: "pantompkins1985"

# ===================================
# AGE HANDLING
# ===================================
age_column:               "age"
enable_age_adaptive_rules: true
